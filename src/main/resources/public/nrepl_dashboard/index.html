<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>nrepl dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- $key$ placeholders are replaced server-side from the shadow build manifest -->
  <script defer type="text/javascript" src="/nrepl_dashboard/$:hyperfiddle.client.module/main$"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f1115; color: #d7dae0;
           font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
    .page { max-width: 960px; margin: 0 auto; padding: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
              padding: 8px 4px; color: #9aa0ab; }
    .header .title { font-size: 18px; font-weight: 600; color: #e8eaee; }
    .card { background: #171a21; border: 1px solid #262b36; border-radius: 8px;
            padding: 12px 16px; margin: 12px 0; }
    .card h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
               letter-spacing: .08em; color: #7d8490; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
    .bar-label { flex: 0 0 220px; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; color: #9aa0ab; font-size: 12px; }
    .bar-track { flex: 1; height: 10px; background: #232733; border-radius: 5px;
                 overflow: hidden; }
    .bar-fill { height: 100%; background: #4f8ef7; border-radius: 5px;
                transition: width .5s ease; }
    .bar-nums { flex: 0 0 200px; text-align: right; font-size: 12px; color: #9aa0ab; }
    input, textarea { width: 100%; background: #0f1115; color: #d7dae0;
                      border: 1px solid #333a47; border-radius: 6px; padding: 8px; }
    button { margin-top: 8px; background: #4f8ef7; color: #fff; border: 0;
             border-radius: 6px; padding: 6px 18px; cursor: pointer; }
    .result { color: #8fd18f; }
    .err { color: #f17d7d; white-space: pre-wrap; }
    pre.result, pre.err { background: #0f1115; border-radius: 6px; padding: 10px;
                          overflow-x: auto; }
  </style>
</head>
<body></body>
</html>
